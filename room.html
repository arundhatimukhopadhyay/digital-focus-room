<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room — Digital Focus Room</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="room-styles.css">
</head>
<body>

    <h1>📚 Study Room</h1>

    <div id="room-link-banner" class="room-link-banner">
        Share this link: <span id="room-link-text"></span>
        <button onclick="copyRoomLink()">Copy Link</button>
    </div>

    <div class="video-grid">
        <div class="video-wrapper">
            <video id="local-video" autoplay muted playsinline></video>
            <span class="video-label">You</span>
        </div>
        <div class="video-wrapper">
            <video id="remote-video" autoplay playsinline></video>
            <span class="video-label">Study Partner</span>
        </div>
    </div>

    <div class="chat-section">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Type a message..." />
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <script src="room.js"></script>
</body>
</html>
